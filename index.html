<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Stacks — Personal PDF Library</title>

<!-- PWA / iOS install metadata -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#11151E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Stacks" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />

<style>
  :root{
    --ink:        #11151E;
    --ink-2:      #171C28;
    --ink-3:      #202737;
    --hairline:   #2B3346;
    --paper:      #F3EEE3;
    --brass:      #C49B5C;
    --brass-dim:  #8E713F;
    --moss:       #4A7C6D;
    --text:       #ECE7DA;
    --text-dim:   #9AA1B4;
    --danger:     #C4695C;
    --safe-top:   env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-left:  env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; }
  .display{ font-family:'Fraunces', Georgia, serif; }

  button{ font-family:inherit; border:none; background:none; color:inherit; }
  ::selection{ background:var(--brass); color:var(--ink); }

  /* ---------- App shell / views ---------- */
  #app{ position:fixed; inset:0; }
  .view{ position:absolute; inset:0; display:none; }
  .view.active{ display:flex; flex-direction:column; }

  /* ---------- Library view ---------- */
  #library{
    padding-top:calc(var(--safe-top) + 14px);
    padding-left:calc(var(--safe-left) + 18px);
    padding-right:calc(var(--safe-right) + 18px);
  }
  .lib-header{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:2px; flex-shrink:0;
  }
  .lib-header h1{
    font-size:30px; margin:0; font-weight:600; letter-spacing:-0.01em; color:var(--text);
  }
  .lib-header .count{
    font-size:12px; color:var(--text-dim); letter-spacing:.04em;
  }
  .lib-scroll{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:calc(var(--safe-bottom) + 110px);
    padding-top:14px;
  }

  .continue-card{
    display:flex; gap:14px; align-items:center;
    background:linear-gradient(135deg, var(--ink-3), var(--ink-2));
    border:1px solid var(--hairline);
    border-radius:16px; padding:12px; margin-bottom:26px;
    cursor:pointer;
  }
  .continue-card .thumb{
    width:52px; height:70px; border-radius:4px; object-fit:cover; flex-shrink:0;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  .continue-card .meta{ flex:1; min-width:0; }
  .continue-card .eyebrow{
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--brass);
    margin-bottom:4px; font-weight:600;
  }
  .continue-card .title{
    font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .continue-card .sub{ font-size:12px; color:var(--text-dim); margin-top:3px; }
  .continue-card .progress-ring{ flex-shrink:0; }

  .section-label{
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim);
    margin:0 0 12px 2px; font-weight:600;
  }

  .shelf{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:16px 12px;
  }
  .book{ cursor:pointer; }
  .book .cover{
    position:relative; border-radius:6px 8px 8px 6px; overflow:hidden;
    aspect-ratio:3/4.2; background:var(--ink-3);
    box-shadow:0 6px 16px rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.05);
  }
  .book .cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .book .cover .spine{
    position:absolute; left:0; top:0; bottom:0; width:6px;
  }
  .book .cover .progress-bar{
    position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(0,0,0,.35);
  }
  .book .cover .progress-bar i{
    display:block; height:100%; background:var(--brass);
  }
  .book .title{
    margin-top:8px; font-size:12.5px; font-weight:600; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .book .pages{ font-size:10.5px; color:var(--text-dim); margin-top:2px; }

  .empty-state{
    margin-top:18vh; text-align:center; color:var(--text-dim); padding:0 30px;
  }
  .empty-state .glyph{ font-size:34px; margin-bottom:10px; }
  .empty-state h2{ color:var(--text); font-size:19px; margin:0 0 6px; font-weight:600; }
  .empty-state p{ font-size:13.5px; line-height:1.5; margin:0; }

  /* Floating import button */
  .fab{
    position:absolute; right:calc(var(--safe-right) + 20px); bottom:calc(var(--safe-bottom) + 22px);
    width:56px; height:56px; border-radius:50%;
    background:var(--brass); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(196,155,92,.35);
    font-size:26px; font-weight:400;
  }
  .fab:active{ transform:scale(.94); }
  #file-input{ display:none; }

  /* Import progress toast */
  .toast{
    position:absolute; left:50%; bottom:calc(var(--safe-bottom) + 90px); transform:translateX(-50%);
    background:var(--ink-3); border:1px solid var(--hairline); color:var(--text);
    padding:10px 16px; border-radius:12px; font-size:12.5px; display:none;
    align-items:center; gap:8px; box-shadow:0 6px 18px rgba(0,0,0,.4); white-space:nowrap;
  }
  .toast.show{ display:flex; }
  .spinner{
    width:12px; height:12px; border-radius:50%;
    border:2px solid rgba(236,231,218,.25); border-top-color:var(--brass);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* Long-press context sheet */
  .sheet-backdrop{
    position:absolute; inset:0; background:rgba(0,0,0,.5); display:none; z-index:20;
  }
  .sheet-backdrop.show{ display:block; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--ink-2);
    border-radius:18px 18px 0 0; padding:10px calc(var(--safe-left) + 8px) calc(var(--safe-bottom) + 8px) calc(var(--safe-right) + 8px);
    transform:translateY(100%); transition:transform .25s ease;
  }
  .sheet-backdrop.show .sheet{ transform:translateY(0); }
  .sheet .handle{ width:36px; height:4px; background:var(--hairline); border-radius:2px; margin:6px auto 12px; }
  .sheet .sheet-title{ padding:0 10px 10px; font-size:14px; font-weight:600; color:var(--text-dim); }
  .sheet button.item{
    width:100%; text-align:left; padding:14px 12px; font-size:15.5px; border-radius:10px;
    display:flex; align-items:center; gap:10px;
  }
  .sheet button.item:active{ background:var(--ink-3); }
  .sheet button.item.destructive{ color:var(--danger); }

  /* ---------- Reader view ---------- */
  #reader{ background:var(--ink); }
  .reader-topbar{
    position:absolute; top:0; left:0; right:0; z-index:10;
    padding-top:calc(var(--safe-top) + 8px);
    padding-left:calc(var(--safe-left) + 10px);
    padding-right:calc(var(--safe-right) + 10px);
    padding-bottom:10px;
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(180deg, rgba(17,21,30,.92), rgba(17,21,30,0));
    transition:transform .25s ease, opacity .25s ease;
  }
  .reader-topbar.hidden{ transform:translateY(-100%); opacity:0; }
  .back-btn{
    width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .reader-topbar .info{ flex:1; min-width:0; }
  .reader-topbar .info .t{
    font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .reader-topbar .info .p{ font-size:10.5px; color:var(--text-dim); margin-top:1px; }
  .zoom-controls{ display:flex; gap:6px; flex-shrink:0; }
  .zoom-controls button{
    width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,.08); font-size:16px;
  }

  #reader-scroll{
    position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-top:calc(var(--safe-top) + 54px);
    padding-bottom:calc(var(--safe-bottom) + 28px);
    display:flex; justify-content:center;
  }
  #page-list{
    width:100%; max-width:820px; padding:0 10px;
    transform-origin:50% 0%;
  }
  .page-wrap{
    position:relative; margin:0 auto 10px; background:var(--ink-2);
    border-radius:3px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .page-wrap canvas{ display:block; width:100%; height:100%; background:var(--paper); }
  .page-wrap .ph{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:11px; letter-spacing:.06em;
  }
  .page-num-badge{
    position:absolute; bottom:8px; right:10px; font-size:10px; color:rgba(255,255,255,.35);
    z-index:2; pointer-events:none;
  }

  .reader-loading{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; color:var(--text-dim); font-size:13px;
  }
  .reader-loading .spinner{ width:20px; height:20px; border-width:2.5px; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="app">

  <!-- ===================== LIBRARY ===================== -->
  <section id="library" class="view active">
    <div class="lib-header">
      <h1 class="display">Stacks</h1>
      <span class="count mono" id="lib-count"></span>
    </div>

    <div class="lib-scroll" id="lib-scroll">
      <div id="continue-wrap"></div>
      <div id="shelf-wrap">
        <p class="section-label" id="shelf-label">Library</p>
        <div class="shelf" id="shelf"></div>
      </div>
      <div class="empty-state hidden" id="empty-state">
        <div class="glyph">📖</div>
        <h2 class="display">Your shelf is empty</h2>
        <p>Tap the + button to import a PDF from your files.<br>Everything stays on this device — nothing is uploaded anywhere.</p>
      </div>
    </div>

    <button class="fab" id="fab">＋</button>
    <input type="file" id="file-input" accept="application/pdf" multiple />
    <div class="toast" id="toast"><span class="spinner"></span><span id="toast-text">Importing…</span></div>
  </section>

  <!-- Long-press sheet -->
  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-title" id="sheet-title"></div>
      <button class="item" id="sheet-rename">✏️&nbsp;&nbsp;Rename</button>
      <button class="item destructive" id="sheet-delete">🗑️&nbsp;&nbsp;Remove from library</button>
      <button class="item" id="sheet-cancel">Cancel</button>
    </div>
  </div>

  <!-- ===================== READER ===================== -->
  <section id="reader" class="view">
    <div class="reader-topbar" id="reader-topbar">
      <button class="back-btn" id="reader-back">‹</button>
      <div class="info">
        <div class="t" id="reader-title"></div>
        <div class="p mono" id="reader-progress"></div>
      </div>
      <div class="zoom-controls">
        <button id="zoom-out">－</button>
        <button id="zoom-in">＋</button>
      </div>
    </div>

    <div id="reader-scroll">
      <div id="page-list"></div>
    </div>

    <div class="reader-loading" id="reader-loading">
      <span class="spinner"></span>
      <span id="reader-loading-text">Opening book…</span>
    </div>
  </section>

</div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

/* =========================================================================
   Stacks — a zero-backend personal PDF library.
   Storage: entirely client-side via IndexedDB. Two object stores:
     "books" — small metadata records (title, page count, thumbnail, position)
     "files" — the raw PDF Blob per book id
   Nothing ever leaves the device; there is no server and no account.
   ========================================================================= */

/* ---------------------------- IndexedDB layer --------------------------- */
const DB_NAME = "stacks-db";
const DB_VERSION = 1;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("books")) {
        db.createObjectStore("books", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("files")) {
        db.createObjectStore("files", { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

const dbp = openDB();

async function tx(storeName, mode){
  const db = await dbp;
  return db.transaction(storeName, mode).objectStore(storeName);
}
function reqToPromise(req){
  return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
}

const Store = {
  async allBooks(){
    const store = await tx("books", "readonly");
    return reqToPromise(store.getAll());
  },
  async putBook(book){
    const store = await tx("books", "readwrite");
    return reqToPromise(store.put(book));
  },
  async getBook(id){
    const store = await tx("books", "readonly");
    return reqToPromise(store.get(id));
  },
  async deleteBook(id){
    const b = await tx("books", "readwrite");
    const f = await tx("files", "readwrite");
    b.delete(id); f.delete(id);
  },
  async putFile(id, blob){
    const store = await tx("files", "readwrite");
    return reqToPromise(store.put({ id, blob }));
  },
  async getFile(id){
    const store = await tx("files", "readonly");
    const rec = await reqToPromise(store.get(id));
    return rec ? rec.blob : null;
  }
};

/* ------------------------------ Utilities -------------------------------- */
function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
}
function niceDate(ts){
  return new Date(ts).toLocaleDateString(undefined, { month:"short", day:"numeric" });
}
// Deterministic "spine" color per title — small library-shelf personality touch.
function spineColor(str){
  let h = 0;
  for (let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  const hue = h % 360;
  return `hsl(${hue} 38% 42%)`;
}
function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

/* ------------------------------- Router ---------------------------------- */
const views = { library: document.getElementById("library"), reader: document.getElementById("reader") };
function showView(name){
  Object.values(views).forEach(v => v.classList.remove("active"));
  views[name].classList.add("active");
}

/* =========================================================================
   LIBRARY VIEW
   ========================================================================= */
const shelfEl = document.getElementById("shelf");
const continueWrap = document.getElementById("continue-wrap");
const shelfLabel = document.getElementById("shelf-label");
const emptyState = document.getElementById("empty-state");
const libCount = document.getElementById("lib-count");
const shelfWrap = document.getElementById("shelf-wrap");

let libraryCache = [];

async function refreshLibrary(){
  libraryCache = await Store.allBooks();
  libraryCache.sort((a,b) => (b.lastOpenedAt||b.addedAt) - (a.lastOpenedAt||a.addedAt));
  renderLibrary();
}

function renderLibrary(){
  const has = libraryCache.length > 0;
  emptyState.classList.toggle("hidden", has);
  shelfWrap.classList.toggle("hidden", !has);
  libCount.textContent = has ? `${libraryCache.length} book${libraryCache.length===1?"":"s"}` : "";

  // Continue reading card = most recently opened book that has progress.
  const recent = libraryCache.find(b => b.lastOpenedAt && b.position && b.position.page > 0);
  continueWrap.innerHTML = "";
  if (recent) {
    const pct = Math.round(((recent.position.page + 1) / Math.max(1, recent.pageCount)) * 100);
    const card = document.createElement("div");
    card.className = "continue-card";
    card.innerHTML = `
      <img class="thumb" src="${recent.thumb}" alt="">
      <div class="meta">
        <div class="eyebrow">Continue reading</div>
        <div class="title">${escapeHtml(recent.title)}</div>
        <div class="sub mono">Page ${recent.position.page + 1} of ${recent.pageCount} · ${pct}%</div>
      </div>`;
    card.addEventListener("click", () => openReader(recent.id));
    continueWrap.appendChild(card);
    shelfLabel.textContent = "Library";
  }

  shelfEl.innerHTML = "";
  const rest = recent ? libraryCache.filter(b => b.id !== recent.id) : libraryCache;
  const byRecent = [...rest].sort((a,b) => (b.addedAt) - (a.addedAt));
  for (const book of byRecent) {
    shelfEl.appendChild(bookCard(book));
  }
}

function bookCard(book){
  const el = document.createElement("div");
  el.className = "book";
  const pct = book.position ? Math.round(((book.position.page + 1) / Math.max(1, book.pageCount)) * 100) : 0;
  el.innerHTML = `
    <div class="cover">
      <span class="spine" style="background:${book.spineColor}"></span>
      <img src="${book.thumb}" alt="">
      ${pct > 0 ? `<div class="progress-bar"><i style="width:${pct}%"></i></div>` : ""}
    </div>
    <div class="title">${escapeHtml(book.title)}</div>
    <div class="pages mono">${book.pageCount} pages · ${niceDate(book.addedAt)}</div>
  `;
  el.addEventListener("click", () => openReader(book.id));
  let pressTimer;
  el.addEventListener("touchstart", () => { pressTimer = setTimeout(() => openSheet(book), 480); }, { passive:true });
  el.addEventListener("touchend", () => clearTimeout(pressTimer));
  el.addEventListener("touchmove", () => clearTimeout(pressTimer));
  el.addEventListener("contextmenu", (e) => { e.preventDefault(); openSheet(book); });
  return el;
}

function escapeHtml(s){
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

/* ---- Long-press action sheet (rename / delete) ---- */
const sheetBackdrop = document.getElementById("sheet-backdrop");
const sheetTitle = document.getElementById("sheet-title");
let sheetBook = null;

function openSheet(book){
  sheetBook = book;
  sheetTitle.textContent = book.title;
  sheetBackdrop.classList.add("show");
}
function closeSheet(){ sheetBackdrop.classList.remove("show"); sheetBook = null; }
sheetBackdrop.addEventListener("click", (e) => { if (e.target === sheetBackdrop) closeSheet(); });
document.getElementById("sheet-cancel").addEventListener("click", closeSheet);
document.getElementById("sheet-delete").addEventListener("click", async () => {
  if (!sheetBook) return;
  await Store.deleteBook(sheetBook.id);
  closeSheet();
  refreshLibrary();
});
document.getElementById("sheet-rename").addEventListener("click", async () => {
  if (!sheetBook) return;
  const name = prompt("Rename book", sheetBook.title);
  if (name && name.trim()) {
    sheetBook.title = name.trim();
    await Store.putBook(sheetBook);
    refreshLibrary();
  }
  closeSheet();
});

/* =========================================================================
   IMPORT FLOW
   ========================================================================= */
const fileInput = document.getElementById("file-input");
document.getElementById("fab").addEventListener("click", () => fileInput.click());

const toast = document.getElementById("toast");
const toastText = document.getElementById("toast-text");

fileInput.addEventListener("change", async (e) => {
  const files = Array.from(e.target.files || []);
  fileInput.value = "";
  if (!files.length) return;

  toast.classList.add("show");
  for (let i=0;i<files.length;i++){
    toastText.textContent = files.length > 1 ? `Importing ${i+1} of ${files.length}…` : "Importing…";
    try { await importPdf(files[i]); }
    catch (err) { console.error("Import failed:", err); alert(`Couldn't import "${files[i].name}": ${err.message || err}`); }
  }
  toast.classList.remove("show");
  refreshLibrary();
});

async function importPdf(file){
  const buf = await file.arrayBuffer();
  // pdf.js will detach/consume the buffer, so keep a separate copy for storage.
  const storeBuf = buf.slice(0);
  const loadingTask = pdfjsLib.getDocument({ data: buf });
  const doc = await loadingTask.promise;
  const pageCount = doc.numPages;

  const page1 = await doc.getPage(1);
  const vp1 = page1.getViewport({ scale: 1 });
  const thumbScale = 300 / vp1.width;
  const thumbVp = page1.getViewport({ scale: thumbScale });
  const canvas = document.createElement("canvas");
  canvas.width = thumbVp.width; canvas.height = thumbVp.height;
  const ctx = canvas.getContext("2d");
  await page1.render({ canvasContext: ctx, viewport: thumbVp }).promise;
  const thumb = canvas.toDataURL("image/jpeg", 0.72);

  const title = file.name.replace(/\.pdf$/i, "");
  const id = uid();
  const book = {
    id, title, pageCount,
    thumb, spineColor: spineColor(title),
    addedAt: Date.now(), lastOpenedAt: null,
    fileSize: file.size,
    position: { page: 0, ratio: 0 }
  };
  await Store.putBook(book);
  await Store.putFile(id, new Blob([storeBuf], { type: "application/pdf" }));
  doc.destroy();
}

/* =========================================================================
   READER VIEW — infinite scroll with lightweight virtualization
   ========================================================================= */
const readerScroll = document.getElementById("reader-scroll");
const pageList = document.getElementById("page-list");
const readerLoading = document.getElementById("reader-loading");
const readerTopbar = document.getElementById("reader-topbar");
const readerTitle = document.getElementById("reader-title");
const readerProgress = document.getElementById("reader-progress");

const RENDER_MARGIN = "1200px 0px 1200px 0px"; // how far ahead/behind we pre-render
const MAX_RENDERED = 10;                        // canvases kept alive at once

let reader = null; // current session state

async function openReader(id){
  const book = await Store.getBook(id);
  if (!book) return;
  showView("reader");
  readerLoading.classList.remove("hidden");
  readerLoading.querySelector("#reader-loading-text").textContent = "Opening book…";
  readerTitle.textContent = book.title;
  pageList.innerHTML = "";
  pageList.style.transform = "none";
  readerTopbar.classList.remove("hidden");

  const blob = await Store.getFile(id);
  if (!blob) { alert("This book's file is missing."); showView("library"); return; }
  const buf = await blob.arrayBuffer();
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;

  const page1 = await doc.getPage(1);
  const baseVp = page1.getViewport({ scale: 1 });
  const baseAspect = baseVp.height / baseVp.width; // used to estimate placeholder heights

  reader = {
    book, doc, baseAspect,
    zoom: 1,
    wraps: [],           // per-page wrapper elements
    rendered: new Map(), // index -> { canvas, task }
    rendering: new Set(),
    observer: null,
    currentIndex: book.position.page || 0,
    savePending: false
  };

  buildPlaceholders();
  setupObserver();
  restoreScrollPosition();
  updateProgressLabel();

  book.lastOpenedAt = Date.now();
  Store.putBook(book);

  readerLoading.classList.add("hidden");
}

function containerWidth(){
  // effective content width available for a page (minus horizontal padding)
  return Math.min(readerScroll.clientWidth, 820) - 20;
}

function buildPlaceholders(){
  pageList.innerHTML = "";
  reader.wraps = [];
  const w = containerWidth() * reader.zoom;
  for (let i=0; i<reader.book.pageCount; i++){
    const wrap = document.createElement("div");
    wrap.className = "page-wrap";
    wrap.dataset.index = i;
    wrap.style.width = w + "px";
    wrap.style.height = Math.round(w * reader.baseAspect) + "px";
    wrap.innerHTML = `<span class="ph">···</span><span class="page-num-badge mono">${i+1}</span>`;
    pageList.appendChild(wrap);
    reader.wraps.push(wrap);
  }
}

function setupObserver(){
  if (reader.observer) reader.observer.disconnect();
  reader.observer = new IntersectionObserver((entries) => {
    for (const entry of entries){
      const idx = Number(entry.target.dataset.index);
      if (entry.isIntersecting) renderPage(idx);
    }
  }, { root: readerScroll, rootMargin: RENDER_MARGIN });
  reader.wraps.forEach(w => reader.observer.observe(w));
}

async function renderPage(idx){
  if (!reader || reader.rendered.has(idx) || reader.rendering.has(idx)) return;
  reader.rendering.add(idx);
  try{
    const page = await reader.doc.getPage(idx + 1);
    const w = containerWidth() * reader.zoom;
    const rawVp = page.getViewport({ scale: 1 });
    const scale = (w / rawVp.width) * (window.devicePixelRatio || 1);
    const viewport = page.getViewport({ scale });

    const wrap = reader.wraps[idx];
    if (!wrap) return;
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = w + "px";
    canvas.style.height = Math.round(w * (viewport.height/viewport.width)) + "px";
    const ctx = canvas.getContext("2d");
    const task = page.render({ canvasContext: ctx, viewport });
    reader.rendered.set(idx, { canvas, task });
    await task.promise;

    // Replace placeholder with the rendered canvas; lock in the true height.
    wrap.style.height = canvas.style.height;
    const ph = wrap.querySelector(".ph");
    if (ph) ph.remove();
    wrap.prepend(canvas);
    pruneRendered(idx);
  } catch(err){
    if (err && err.name !== "RenderingCancelledException") console.warn("Page render failed", idx, err);
  } finally {
    reader.rendering.delete(idx);
  }
}

function unrenderPage(idx){
  const rec = reader.rendered.get(idx);
  if (!rec) return;
  try { rec.task && rec.task.cancel && rec.task.cancel(); } catch(e){}
  const wrap = reader.wraps[idx];
  if (wrap && rec.canvas.parentElement === wrap){
    wrap.removeChild(rec.canvas);
    const ph = document.createElement("span");
    ph.className = "ph"; ph.textContent = "···";
    wrap.prepend(ph);
  }
  reader.rendered.delete(idx);
}

function pruneRendered(centerIdx){
  if (reader.rendered.size <= MAX_RENDERED) return;
  const indices = [...reader.rendered.keys()].sort((a,b) => Math.abs(b-centerIdx) - Math.abs(a-centerIdx));
  while (reader.rendered.size > MAX_RENDERED){
    unrenderPage(indices.shift());
  }
}

/* ---- scroll tracking: current page, progress label, position persistence ---- */
let lastTopbarShow = true;
let lastScrollTop = 0;

readerScroll.addEventListener("scroll", () => {
  if (!reader) return;

  // auto-hide topbar on downward scroll, reappear on scroll up
  const st = readerScroll.scrollTop;
  if (Math.abs(st - lastScrollTop) > 6){
    const goingDown = st > lastScrollTop;
    if (goingDown && lastTopbarShow && st > 80){ readerTopbar.classList.add("hidden"); lastTopbarShow = false; }
    else if (!goingDown && !lastTopbarShow){ readerTopbar.classList.remove("hidden"); lastTopbarShow = true; }
    lastScrollTop = st;
  }

  updateCurrentIndex();
  schedulePositionSave();
}, { passive:true });

function updateCurrentIndex(){
  const refY = readerScroll.scrollTop + 90; // reference line near top of viewport
  let idx = reader.currentIndex;
  for (let i=0;i<reader.wraps.length;i++){
    const wrap = reader.wraps[i];
    if (wrap.offsetTop <= refY && wrap.offsetTop + wrap.offsetHeight > refY){ idx = i; break; }
  }
  reader.currentIndex = idx;
  updateProgressLabel();
}
function updateProgressLabel(){
  readerProgress.textContent = `Page ${reader.currentIndex + 1} of ${reader.book.pageCount}`;
}

function currentPositionRatio(){
  const wrap = reader.wraps[reader.currentIndex];
  if (!wrap) return 0;
  const refY = readerScroll.scrollTop + 90;
  return Math.min(1, Math.max(0, (refY - wrap.offsetTop) / wrap.offsetHeight));
}

const schedulePositionSave = debounce(() => {
  if (!reader) return;
  reader.book.position = { page: reader.currentIndex, ratio: currentPositionRatio() };
  Store.putBook(reader.book);
}, 450);

function saveNow(){
  if (!reader) return;
  reader.book.position = { page: reader.currentIndex, ratio: currentPositionRatio() };
  Store.putBook(reader.book);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(); });
window.addEventListener("pagehide", saveNow);

function restoreScrollPosition(){
  const { page, ratio } = reader.book.position || { page:0, ratio:0 };
  const wrap = reader.wraps[page];
  if (!wrap) return;
  const target = wrap.offsetTop + (ratio || 0) * wrap.offsetHeight - 90;
  readerScroll.scrollTop = Math.max(0, target);
  reader.currentIndex = page;
}

/* ---- Back / close reader ---- */
document.getElementById("reader-back").addEventListener("click", closeReader);
function closeReader(){
  saveNow();
  if (reader){
    reader.observer && reader.observer.disconnect();
    reader.rendered.forEach((_, idx) => unrenderPage(idx));
    reader.doc && reader.doc.destroy();
  }
  reader = null;
  showView("library");
  refreshLibrary();
}

/* ---- Zoom controls (buttons + pinch gesture) ---- */
function applyZoom(newZoom){
  if (!reader) return;
  newZoom = Math.min(3, Math.max(0.6, newZoom));
  if (Math.abs(newZoom - reader.zoom) < 0.01) return;

  const savedIdx = reader.currentIndex;
  const savedRatio = currentPositionRatio();

  reader.zoom = newZoom;
  reader.rendered.forEach((_, idx) => unrenderPage(idx));
  buildPlaceholders();
  setupObserver();

  const wrap = reader.wraps[savedIdx];
  if (wrap){
    readerScroll.scrollTop = Math.max(0, wrap.offsetTop + savedRatio * wrap.offsetHeight - 90);
  }
}
document.getElementById("zoom-in").addEventListener("click", () => applyZoom(reader.zoom + 0.2));
document.getElementById("zoom-out").addEventListener("click", () => applyZoom(reader.zoom - 0.2));

// Pinch-to-zoom: live CSS-transform preview while pinching, committed (re-rendered) on release.
let pinch = null;
readerScroll.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2 && reader){
    const [a,b] = e.touches;
    pinch = {
      startDist: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY),
      startZoom: reader.zoom,
      originX: (a.clientX + b.clientX)/2 - pageList.getBoundingClientRect().left,
      originY: (a.clientY + b.clientY)/2 - pageList.getBoundingClientRect().top + readerScroll.scrollTop
    };
    pageList.style.transformOrigin = `${pinch.originX}px ${pinch.originY}px`;
  }
}, { passive:true });

readerScroll.addEventListener("touchmove", (e) => {
  if (pinch && e.touches.length === 2){
    const [a,b] = e.touches;
    const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const ratio = dist / pinch.startDist;
    pageList.style.transform = `scale(${ratio})`;
  }
}, { passive:true });

readerScroll.addEventListener("touchend", (e) => {
  if (pinch && e.touches.length < 2){
    const scaleEl = pageList.style.transform;
    const m = /scale\(([\d.]+)\)/.exec(scaleEl);
    const ratio = m ? parseFloat(m[1]) : 1;
    pageList.style.transform = "none";
    applyZoom(pinch.startZoom * ratio);
    pinch = null;
  }
});

/* ---- Re-layout on device rotation ---- */
window.addEventListener("resize", debounce(() => { if (reader) applyZoom(reader.zoom); }, 200));

/* =========================================================================
   Boot
   ========================================================================= */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
refreshLibrary();
</script>
</body>
</html>
