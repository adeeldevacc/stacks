<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Stacks — Personal PDF Library</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#11151E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Stacks" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />

<style>
  :root{
    --ink:        #11151E;
    --ink-2:      #171C28;
    --ink-3:      #202737;
    --hairline:   #2B3346;
    --paper:      #F3EEE3;
    --brass:      #C49B5C;
    --brass-dim:  #8E713F;
    --text:       #ECE7DA;
    --text-dim:   #9AA1B4;
    --danger:     #C4695C;
    --safe-top:   env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-left:  env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; }
  .display{ font-family:'Fraunces', Georgia, serif; }
  button{ font-family:inherit; border:none; background:none; color:inherit; }
  ::selection{ background:var(--brass); color:var(--ink); }
  .hidden{ display:none !important; }

  #app{ position:fixed; inset:0; }
  .view{ position:absolute; inset:0; display:none; }
  .view.active{ display:flex; flex-direction:column; }

  /* ---------- Library ---------- */
  #library{
    padding-top:calc(var(--safe-top) + 14px);
    padding-left:calc(var(--safe-left) + 18px);
    padding-right:calc(var(--safe-right) + 18px);
  }
  .lib-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px; flex-shrink:0; }
  .lib-header h1{ font-size:30px; margin:0; font-weight:600; letter-spacing:-0.01em; }
  .lib-header .count{ font-size:12px; color:var(--text-dim); letter-spacing:.04em; }
  .lib-scroll{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:calc(var(--safe-bottom) + 110px); padding-top:14px;
  }
  .continue-card{
    display:flex; gap:14px; align-items:center;
    background:linear-gradient(135deg, var(--ink-3), var(--ink-2));
    border:1px solid var(--hairline); border-radius:16px; padding:12px; margin-bottom:26px; cursor:pointer;
  }
  .continue-card .thumb{ width:52px; height:70px; border-radius:4px; object-fit:cover; flex-shrink:0; box-shadow:0 4px 12px rgba(0,0,0,.4); }
  .continue-card .meta{ flex:1; min-width:0; }
  .continue-card .eyebrow{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--brass); margin-bottom:4px; font-weight:600; }
  .continue-card .title{ font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .continue-card .sub{ font-size:12px; color:var(--text-dim); margin-top:3px; }
  .section-label{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); margin:0 0 12px 2px; font-weight:600; }
  .shelf{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px 12px; }
  .book{ cursor:pointer; }
  .book .cover{
    position:relative; border-radius:6px 8px 8px 6px; overflow:hidden; aspect-ratio:3/4.2;
    background:var(--ink-3); box-shadow:0 6px 16px rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.05);
  }
  .book .cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .book .cover .spine{ position:absolute; left:0; top:0; bottom:0; width:6px; }
  .book .cover .progress-bar{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(0,0,0,.35); }
  .book .cover .progress-bar i{ display:block; height:100%; background:var(--brass); }
  .book .title{ margin-top:8px; font-size:12.5px; font-weight:600; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .book .pages{ font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .empty-state{ margin-top:18vh; text-align:center; color:var(--text-dim); padding:0 30px; }
  .empty-state .glyph{ font-size:34px; margin-bottom:10px; }
  .empty-state h2{ color:var(--text); font-size:19px; margin:0 0 6px; font-weight:600; }
  .empty-state p{ font-size:13.5px; line-height:1.5; margin:0; }
  .fab{
    position:absolute; right:calc(var(--safe-right) + 20px); bottom:calc(var(--safe-bottom) + 22px);
    width:56px; height:56px; border-radius:50%; background:var(--brass); color:var(--ink);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(196,155,92,.35); font-size:26px;
  }
  .fab:active{ transform:scale(.94); }
  #file-input{ display:none; }
  .toast{
    position:absolute; left:50%; bottom:calc(var(--safe-bottom) + 90px); transform:translateX(-50%);
    background:var(--ink-3); border:1px solid var(--hairline); padding:10px 16px; border-radius:12px;
    font-size:12.5px; display:none; align-items:center; gap:8px; box-shadow:0 6px 18px rgba(0,0,0,.4); white-space:nowrap;
  }
  .toast.show{ display:flex; }
  .spinner{ width:12px; height:12px; border-radius:50%; border:2px solid rgba(236,231,218,.25); border-top-color:var(--brass); animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* ---------- Bottom sheets (shared) ---------- */
  .sheet-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.5); display:none; z-index:30; }
  .sheet-backdrop.show{ display:block; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--ink-2);
    border-radius:18px 18px 0 0; padding:10px calc(var(--safe-left) + 8px) calc(var(--safe-bottom) + 10px) calc(var(--safe-right) + 8px);
    transform:translateY(100%); transition:transform .25s ease; max-height:85vh; overflow-y:auto;
  }
  .sheet-backdrop.show .sheet{ transform:translateY(0); }
  .sheet .handle{ width:36px; height:4px; background:var(--hairline); border-radius:2px; margin:6px auto 12px; }
  .sheet .sheet-title{ padding:0 10px 10px; font-size:14px; font-weight:600; color:var(--text-dim); }
  .sheet button.item{ width:100%; text-align:left; padding:14px 12px; font-size:15.5px; border-radius:10px; display:flex; align-items:center; gap:10px; }
  .sheet button.item:active{ background:var(--ink-3); }
  .sheet button.item.destructive{ color:var(--danger); }

  /* ---------- Settings sheet controls ---------- */
  .setting-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 12px; border-top:1px solid var(--hairline); }
  .setting-row:first-of-type{ border-top:none; }
  .seg-label{ font-size:14px; font-weight:500; color:var(--text); }
  .segmented{ display:flex; background:var(--ink-3); border-radius:9px; padding:3px; gap:2px; }
  .segmented button{ padding:6px 12px; font-size:12.5px; border-radius:7px; color:var(--text-dim); font-weight:600; }
  .segmented button.active{ background:var(--brass); color:var(--ink); }
  .segmented button[disabled]{ opacity:.3; pointer-events:none; }
  .stepper{ display:flex; align-items:center; gap:12px; }
  .stepper button{ width:30px; height:30px; border-radius:8px; background:var(--ink-3); font-size:14px; font-weight:700; }
  .stepper button:active{ background:var(--hairline); }
  .stepper span{ min-width:20px; text-align:center; font-size:13px; color:var(--text-dim); }
  .theme-swatches{ display:flex; gap:10px; }
  .swatch{ width:28px; height:28px; border-radius:50%; border:2px solid transparent; }
  .swatch.active{ border-color:var(--brass); }
  .swatch.light{ background:#FFFFFF; }
  .swatch.sepia{ background:#F1E4C9; }
  .swatch.dark{ background:#2A3040; }
  .swatch.black{ background:#000000; border-color:#333; }
  .swatch.dark.active, .swatch.black.active{ border-color:var(--brass); }
  .switch{ position:relative; width:44px; height:26px; display:inline-block; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider-pill{ position:absolute; inset:0; background:var(--ink-3); border-radius:13px; transition:.2s; }
  .slider-pill::before{ content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:var(--text-dim); border-radius:50%; transition:.2s; }
  .switch input:checked + .slider-pill{ background:var(--brass-dim); }
  .switch input:checked + .slider-pill::before{ transform:translateX(18px); background:var(--ink); }
  .settings-sheet[data-mode="original"] .reflow-only{ display:none; }
  .settings-sheet[data-mode="reflow"] .original-only{ display:none; }

  /* ---------- Reader ---------- */
  #reader{ background:var(--ink); }
  .reader-topbar{
    position:absolute; top:0; left:0; right:0; z-index:10;
    padding:calc(var(--safe-top) + 8px) calc(var(--safe-right) + 10px) 10px calc(var(--safe-left) + 10px);
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(180deg, rgba(17,21,30,.94), rgba(17,21,30,0));
    transition:transform .25s ease, opacity .25s ease;
  }
  .reader-topbar.hidden{ transform:translateY(-100%); opacity:0; }
  .icon-btn{ width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .icon-btn.text{ font-size:14px; font-weight:700; font-family:'Fraunces', Georgia, serif; }
  .reader-topbar .info{ flex:1; min-width:0; }
  .reader-topbar .info .t{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .reader-topbar .info .p{ font-size:10.5px; color:var(--text-dim); margin-top:1px; }

  #reader-scroll{
    position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-top:calc(var(--safe-top) + 54px); padding-bottom:calc(var(--safe-bottom) + 46px);
    display:flex; justify-content:center;
    background:var(--read-bg, var(--ink));
    transition:background .2s ease;
  }
  #reader[data-theme="dark"]  #reader-scroll{ --read-bg:#11151E; --read-fg:#ECE7DA; }
  #reader[data-theme="black"] #reader-scroll{ --read-bg:#000000; --read-fg:#D7D7D7; }
  #reader[data-theme="sepia"] #reader-scroll{ --read-bg:#EFE1C4; --read-fg:#3B2F1E; }
  #reader[data-theme="light"] #reader-scroll{ --read-bg:#FBFAF7; --read-fg:#1B1B1B; }

  #page-list{ width:100%; max-width:820px; padding:0 10px; transform-origin:50% 0%; }
  #page-list.invert-canvases canvas{ filter:invert(1) hue-rotate(180deg); }
  .page-wrap{
    position:relative; margin:0 auto 10px; background:var(--ink-2); border-radius:3px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .page-wrap canvas{ display:block; width:100%; height:100%; background:var(--paper); }
  .page-wrap .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:11px; letter-spacing:.06em; }
  .page-num-badge{ position:absolute; bottom:8px; right:10px; font-size:10px; color:rgba(255,255,255,.35); z-index:2; pointer-events:none; }

  #reflow-list{
    width:100%; max-width:640px; color:var(--read-fg, var(--text)); padding:8px 26px 10px;
    font-family:'Fraunces', Georgia, serif; font-size:18px; line-height:1.6;
  }
  .reflow-p{ margin:0 0 1em; }
  .reflow-p.heading{ font-weight:700; font-size:1.35em; margin:1.1em 0 .5em; line-height:1.3; }
  .reflow-note{ text-align:center; color:var(--text-dim); font-size:12.5px; padding:40px 20px; line-height:1.6; }

  .reader-loading{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; color:var(--text-dim); font-size:13px; background:var(--ink); z-index:5;
  }
  .reader-loading .spinner{ width:20px; height:20px; border-width:2.5px; }

  /* ---------- Scrubber ---------- */
  .scrubber{
    position:absolute; left:0; right:0; bottom:0; z-index:10;
    padding:14px calc(var(--safe-right) + 16px) calc(var(--safe-bottom) + 10px) calc(var(--safe-left) + 16px);
    background:linear-gradient(0deg, rgba(17,21,30,.94), rgba(17,21,30,0));
    transition:transform .25s ease, opacity .25s ease;
  }
  .scrubber.hidden{ transform:translateY(100%); opacity:0; }
  .track{ position:relative; height:20px; display:flex; align-items:center; touch-action:none; }
  .track::before{ content:""; position:absolute; left:0; right:0; height:3px; background:rgba(255,255,255,.12); border-radius:2px; }
  .fill{ position:absolute; left:0; height:3px; background:var(--brass); border-radius:2px; width:0%; pointer-events:none; }
  .knob{ position:absolute; left:0%; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--brass); box-shadow:0 2px 6px rgba(0,0,0,.4); pointer-events:none; }
  .scrub-tooltip{
    position:fixed; bottom:calc(var(--safe-bottom) + 46px); transform:translateX(-50%);
    background:var(--ink-3); border:1px solid var(--hairline); color:var(--text); padding:5px 10px; border-radius:8px;
    font-size:12px; display:none; z-index:15; white-space:nowrap;
  }
  .scrub-tooltip.show{ display:block; }
</style>
</head>
<body>

<div id="app">

  <!-- ===================== LIBRARY ===================== -->
  <section id="library" class="view active">
    <div class="lib-header">
      <h1 class="display">Stacks</h1>
      <span class="count mono" id="lib-count"></span>
    </div>
    <div class="lib-scroll" id="lib-scroll">
      <div id="continue-wrap"></div>
      <div id="shelf-wrap">
        <p class="section-label" id="shelf-label">Library</p>
        <div class="shelf" id="shelf"></div>
      </div>
      <div class="empty-state hidden" id="empty-state">
        <div class="glyph">📖</div>
        <h2 class="display">Your shelf is empty</h2>
        <p>Tap the + button to import a PDF from your files.<br>Everything stays on this device — nothing is uploaded anywhere.</p>
      </div>
    </div>
    <button class="fab" id="fab">＋</button>
    <input type="file" id="file-input" accept="application/pdf" multiple />
    <div class="toast" id="toast"><span class="spinner"></span><span id="toast-text">Importing…</span></div>
  </section>

  <!-- Rename / delete sheet -->
  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-title" id="sheet-title"></div>
      <button class="item" id="sheet-rename">✏️&nbsp;&nbsp;Rename</button>
      <button class="item destructive" id="sheet-delete">🗑️&nbsp;&nbsp;Remove from library</button>
      <button class="item" id="sheet-cancel">Cancel</button>
    </div>
  </div>

  <!-- ===================== READER ===================== -->
  <section id="reader" class="view" data-theme="dark">
    <div class="reader-topbar" id="reader-topbar">
      <button class="icon-btn" id="reader-back">‹</button>
      <div class="info">
        <div class="t" id="reader-title"></div>
        <div class="p mono" id="reader-progress"></div>
      </div>
      <button class="icon-btn text" id="settings-btn">Aa</button>
    </div>

    <div id="reader-scroll">
      <div id="page-list"></div>
      <div id="reflow-list" class="hidden"></div>
    </div>

    <div class="scrubber" id="scrubber">
      <div class="track" id="scrubber-track">
        <div class="fill" id="scrubber-fill"></div>
        <div class="knob" id="scrubber-knob"></div>
      </div>
    </div>
    <div class="scrub-tooltip" id="scrub-tooltip"></div>

    <div class="reader-loading" id="reader-loading">
      <span class="spinner"></span>
      <span id="reader-loading-text">Opening book…</span>
    </div>
  </section>

  <!-- Display / settings sheet -->
  <div class="sheet-backdrop" id="settings-backdrop">
    <div class="sheet settings-sheet" id="settings-sheet" data-mode="original">
      <div class="handle"></div>
      <div class="sheet-title">Display</div>

      <div class="setting-row">
        <span class="seg-label">View</span>
        <div class="segmented" id="mode-segmented">
          <button data-mode="original" class="active">Original</button>
          <button data-mode="reflow">Reflow</button>
        </div>
      </div>

      <div class="setting-row original-only">
        <span class="seg-label">Zoom</span>
        <div class="stepper">
          <button id="zoom-dec">－</button>
          <span id="zoom-val" class="mono">100%</span>
          <button id="zoom-inc">＋</button>
        </div>
      </div>

      <div class="setting-row original-only">
        <span class="seg-label">Invert scanned pages</span>
        <label class="switch"><input type="checkbox" id="invert-toggle"><span class="slider-pill"></span></label>
      </div>

      <div class="setting-row reflow-only">
        <span class="seg-label">Text size</span>
        <div class="stepper">
          <button id="font-dec">A－</button>
          <span id="font-val" class="mono">18</span>
          <button id="font-inc">A＋</button>
        </div>
      </div>

      <div class="setting-row reflow-only">
        <span class="seg-label">Font</span>
        <div class="segmented" id="font-segmented">
          <button data-font="serif" class="active">Serif</button>
          <button data-font="sans">Sans</button>
        </div>
      </div>

      <div class="setting-row reflow-only">
        <span class="seg-label">Line spacing</span>
        <div class="segmented" id="spacing-segmented">
          <button data-spacing="compact">Tight</button>
          <button data-spacing="normal" class="active">Normal</button>
          <button data-spacing="relaxed">Loose</button>
        </div>
      </div>

      <div class="setting-row reflow-only">
        <span class="seg-label">Margins</span>
        <div class="segmented" id="margin-segmented">
          <button data-margin="narrow">Narrow</button>
          <button data-margin="normal" class="active">Normal</button>
          <button data-margin="wide">Wide</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="seg-label">Theme</span>
        <div class="theme-swatches" id="theme-swatches">
          <button data-theme="light" class="swatch light"></button>
          <button data-theme="sepia" class="swatch sepia"></button>
          <button data-theme="dark" class="swatch dark active"></button>
          <button data-theme="black" class="swatch black"></button>
        </div>
      </div>

      <button class="item" id="settings-done">Done</button>
    </div>
  </div>

</div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

/* =========================================================================
   Stacks — zero-backend personal PDF library.
   Storage: IndexedDB only ("books" metadata + "files" blobs). Nothing leaves
   the device. Display preferences (theme/font/etc.) live in localStorage.
   ========================================================================= */

/* ---------------------------- IndexedDB layer --------------------------- */
const DB_NAME = "stacks-db";
const DB_VERSION = 1;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("books")) db.createObjectStore("books", { keyPath: "id" });
      if (!db.objectStoreNames.contains("files")) db.createObjectStore("files", { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const dbp = openDB();
async function tx(storeName, mode){ const db = await dbp; return db.transaction(storeName, mode).objectStore(storeName); }
function reqToPromise(req){ return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }

const Store = {
  async allBooks(){ const s = await tx("books","readonly"); return reqToPromise(s.getAll()); },
  async putBook(book){ const s = await tx("books","readwrite"); return reqToPromise(s.put(book)); },
  async getBook(id){ const s = await tx("books","readonly"); return reqToPromise(s.get(id)); },
  async deleteBook(id){ const b=await tx("books","readwrite"); const f=await tx("files","readwrite"); b.delete(id); f.delete(id); },
  async putFile(id, blob){ const s = await tx("files","readwrite"); return reqToPromise(s.put({ id, blob })); },
  async getFile(id){ const s = await tx("files","readonly"); const rec = await reqToPromise(s.get(id)); return rec ? rec.blob : null; }
};

/* ------------------------------ Utilities -------------------------------- */
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`); }
function niceDate(ts){ return new Date(ts).toLocaleDateString(undefined, { month:"short", day:"numeric" }); }
function spineColor(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return `hsl(${h%360} 38% 42%)`; }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function escapeHtml(s){ const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

/* ------------------------------- Router ---------------------------------- */
const views = { library: document.getElementById("library"), reader: document.getElementById("reader") };
function showView(name){ Object.values(views).forEach(v => v.classList.remove("active")); views[name].classList.add("active"); }

/* =========================================================================
   DISPLAY PREFERENCES (global, persisted in localStorage)
   ========================================================================= */
const PREFS_KEY = "stacks-prefs-v1";
const DEFAULT_PREFS = { theme:"dark", fontSize:18, fontFamily:"serif", lineSpacing:"normal", margin:"normal", invert:false, zoom:1 };
let prefs = { ...DEFAULT_PREFS, ...(JSON.parse(localStorage.getItem(PREFS_KEY) || "{}")) };
function savePrefs(){ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }

const readerEl = document.getElementById("reader");
const pageList = document.getElementById("page-list");
const reflowList = document.getElementById("reflow-list");

function applyTheme(){
  readerEl.dataset.theme = prefs.theme;
  document.querySelectorAll("#theme-swatches .swatch").forEach(b => b.classList.toggle("active", b.dataset.theme === prefs.theme));
}
function applyReflowStyle(){
  reflowList.style.fontSize = prefs.fontSize + "px";
  reflowList.style.lineHeight = ({ compact:1.35, normal:1.6, relaxed:1.85 })[prefs.lineSpacing];
  reflowList.style.fontFamily = prefs.fontFamily === "serif" ? "'Fraunces', Georgia, serif" : "'Public Sans', -apple-system, sans-serif";
  const m = ({ narrow:"14px", normal:"26px", wide:"46px" })[prefs.margin];
  reflowList.style.paddingLeft = m; reflowList.style.paddingRight = m;
  document.getElementById("font-val").textContent = prefs.fontSize;
  document.querySelectorAll("#font-segmented button").forEach(b => b.classList.toggle("active", b.dataset.font === prefs.fontFamily));
  document.querySelectorAll("#spacing-segmented button").forEach(b => b.classList.toggle("active", b.dataset.spacing === prefs.lineSpacing));
  document.querySelectorAll("#margin-segmented button").forEach(b => b.classList.toggle("active", b.dataset.margin === prefs.margin));
}
function applyInvert(){
  pageList.classList.toggle("invert-canvases", !!prefs.invert);
  document.getElementById("invert-toggle").checked = !!prefs.invert;
}
function applyZoomLabel(){ document.getElementById("zoom-val").textContent = Math.round((reader ? reader.zoom : prefs.zoom) * 100) + "%"; }

/* =========================================================================
   LIBRARY VIEW
   ========================================================================= */
const shelfEl = document.getElementById("shelf");
const continueWrap = document.getElementById("continue-wrap");
const shelfLabel = document.getElementById("shelf-label");
const emptyState = document.getElementById("empty-state");
const libCount = document.getElementById("lib-count");
const shelfWrap = document.getElementById("shelf-wrap");
let libraryCache = [];

async function refreshLibrary(){
  libraryCache = await Store.allBooks();
  libraryCache.sort((a,b) => (b.lastOpenedAt||b.addedAt) - (a.lastOpenedAt||a.addedAt));
  renderLibrary();
}
function renderLibrary(){
  const has = libraryCache.length > 0;
  emptyState.classList.toggle("hidden", has);
  shelfWrap.classList.toggle("hidden", !has);
  libCount.textContent = has ? `${libraryCache.length} book${libraryCache.length===1?"":"s"}` : "";

  const recent = libraryCache.find(b => b.lastOpenedAt && b.position && b.position.page > 0);
  continueWrap.innerHTML = "";
  if (recent) {
    const pct = Math.round(((recent.position.page + 1) / Math.max(1, recent.pageCount)) * 100);
    const card = document.createElement("div");
    card.className = "continue-card";
    card.innerHTML = `
      <img class="thumb" src="${recent.thumb}" alt="">
      <div class="meta">
        <div class="eyebrow">Continue reading</div>
        <div class="title">${escapeHtml(recent.title)}</div>
        <div class="sub mono">Page ${recent.position.page + 1} of ${recent.pageCount} · ${pct}%</div>
      </div>`;
    card.addEventListener("click", () => openReader(recent.id));
    continueWrap.appendChild(card);
    shelfLabel.textContent = "Library";
  }

  shelfEl.innerHTML = "";
  const rest = recent ? libraryCache.filter(b => b.id !== recent.id) : libraryCache;
  const byRecent = [...rest].sort((a,b) => (b.addedAt) - (a.addedAt));
  for (const book of byRecent) shelfEl.appendChild(bookCard(book));
}
function bookCard(book){
  const el = document.createElement("div");
  el.className = "book";
  const pct = book.position ? Math.round(((book.position.page + 1) / Math.max(1, book.pageCount)) * 100) : 0;
  el.innerHTML = `
    <div class="cover">
      <span class="spine" style="background:${book.spineColor}"></span>
      <img src="${book.thumb}" alt="">
      ${pct > 0 ? `<div class="progress-bar"><i style="width:${pct}%"></i></div>` : ""}
    </div>
    <div class="title">${escapeHtml(book.title)}</div>
    <div class="pages mono">${book.pageCount} pages · ${niceDate(book.addedAt)}</div>`;
  el.addEventListener("click", () => openReader(book.id));
  let pressTimer;
  el.addEventListener("touchstart", () => { pressTimer = setTimeout(() => openSheet(book), 480); }, { passive:true });
  el.addEventListener("touchend", () => clearTimeout(pressTimer));
  el.addEventListener("touchmove", () => clearTimeout(pressTimer));
  el.addEventListener("contextmenu", (e) => { e.preventDefault(); openSheet(book); });
  return el;
}

const sheetBackdrop = document.getElementById("sheet-backdrop");
const sheetTitle = document.getElementById("sheet-title");
let sheetBook = null;
function openSheet(book){ sheetBook = book; sheetTitle.textContent = book.title; sheetBackdrop.classList.add("show"); }
function closeSheet(){ sheetBackdrop.classList.remove("show"); sheetBook = null; }
sheetBackdrop.addEventListener("click", (e) => { if (e.target === sheetBackdrop) closeSheet(); });
document.getElementById("sheet-cancel").addEventListener("click", closeSheet);
document.getElementById("sheet-delete").addEventListener("click", async () => {
  if (!sheetBook) return;
  await Store.deleteBook(sheetBook.id);
  closeSheet(); refreshLibrary();
});
document.getElementById("sheet-rename").addEventListener("click", async () => {
  if (!sheetBook) return;
  const name = prompt("Rename book", sheetBook.title);
  if (name && name.trim()) { sheetBook.title = name.trim(); await Store.putBook(sheetBook); refreshLibrary(); }
  closeSheet();
});

/* =========================================================================
   IMPORT FLOW
   ========================================================================= */
const fileInput = document.getElementById("file-input");
document.getElementById("fab").addEventListener("click", () => fileInput.click());
const toast = document.getElementById("toast");
const toastText = document.getElementById("toast-text");

fileInput.addEventListener("change", async (e) => {
  const files = Array.from(e.target.files || []);
  fileInput.value = "";
  if (!files.length) return;
  toast.classList.add("show");
  for (let i=0;i<files.length;i++){
    toastText.textContent = files.length > 1 ? `Importing ${i+1} of ${files.length}…` : "Importing…";
    try { await importPdf(files[i]); }
    catch (err) { console.error("Import failed:", err); alert(`Couldn't import "${files[i].name}": ${err.message || err}`); }
  }
  toast.classList.remove("show");
  refreshLibrary();
});

async function importPdf(file){
  const buf = await file.arrayBuffer();
  const storeBuf = buf.slice(0);
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  const pageCount = doc.numPages;
  const page1 = await doc.getPage(1);
  const vp1 = page1.getViewport({ scale: 1 });
  const thumbVp = page1.getViewport({ scale: 300 / vp1.width });
  const canvas = document.createElement("canvas");
  canvas.width = thumbVp.width; canvas.height = thumbVp.height;
  await page1.render({ canvasContext: canvas.getContext("2d"), viewport: thumbVp }).promise;
  const thumb = canvas.toDataURL("image/jpeg", 0.72);

  const title = file.name.replace(/\.pdf$/i, "");
  const id = uid();
  const book = {
    id, title, pageCount, thumb, spineColor: spineColor(title),
    addedAt: Date.now(), lastOpenedAt: null, fileSize: file.size,
    position: { page: 0, ratio: 0 }, reflowPosition: { page: 0, ratio: 0 }, readMode: "original"
  };
  await Store.putBook(book);
  await Store.putFile(id, new Blob([storeBuf], { type: "application/pdf" }));
  doc.destroy();
}

/* =========================================================================
   READER VIEW — infinite scroll (original) + reflow text mode
   ========================================================================= */
const readerScroll = document.getElementById("reader-scroll");
const readerLoading = document.getElementById("reader-loading");
const readerTopbar = document.getElementById("reader-topbar");
const readerTitle = document.getElementById("reader-title");
const readerProgress = document.getElementById("reader-progress");
const scrubber = document.getElementById("scrubber");
const scrubberTrack = document.getElementById("scrubber-track");
const scrubberFill = document.getElementById("scrubber-fill");
const scrubberKnob = document.getElementById("scrubber-knob");
const scrubTooltip = document.getElementById("scrub-tooltip");

const RENDER_MARGIN = "1200px 0px 1200px 0px";
const MAX_RENDERED = 10;
let reader = null;

function setLoadingText(t){ document.getElementById("reader-loading-text").textContent = t; }

async function openReader(id){
  const book = await Store.getBook(id);
  if (!book) return;
  if (!book.reflowPosition) book.reflowPosition = { page:0, ratio:0 };
  showView("reader");
  readerLoading.classList.remove("hidden");
  setLoadingText("Opening book…");
  readerTitle.textContent = book.title;
  pageList.innerHTML = ""; pageList.style.transform = "none";
  reflowList.innerHTML = "";
  readerTopbar.classList.remove("hidden");
  scrubber.classList.remove("hidden");

  const blob = await Store.getFile(id);
  if (!blob) { alert("This book's file is missing."); showView("library"); return; }
  const buf = await blob.arrayBuffer();
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  const page1 = await doc.getPage(1);
  const baseVp = page1.getViewport({ scale: 1 });
  const baseAspect = baseVp.height / baseVp.width;

  reader = {
    book, doc, baseAspect, zoom: prefs.zoom || 1,
    wraps: [], rendered: new Map(), rendering: new Set(), observer: null,
    reflowBlocks: [], reflowBuilt: false, reflowAvailable: false,
    mode: "original", currentIndex: book.position.page || 0
  };

  reader.reflowAvailable = await checkReflowAvailable(doc).catch(() => false);
  updateModeAvailability();

  applyTheme(); applyInvert(); applyReflowStyle(); applyZoomLabel();
  buildPlaceholders(); setupObserver();

  const initialMode = (book.readMode === "reflow" && reader.reflowAvailable) ? "reflow" : "original";
  if (initialMode === "reflow") { await switchReaderMode("reflow", true); }
  else { await switchReaderMode("original", true); }

  settingsSheet.dataset.mode = reader.mode;
  document.querySelectorAll("#mode-segmented button").forEach(b => b.classList.toggle("active", b.dataset.mode === reader.mode));
  updateProgressLabel();
  updateScrubberFill();
  readerLoading.classList.add("hidden");

  book.lastOpenedAt = Date.now();
  Store.putBook(book);
}

function containerWidth(){ return Math.min(readerScroll.clientWidth, 820) - 20; }

function buildPlaceholders(){
  pageList.innerHTML = "";
  reader.wraps = [];
  const w = containerWidth() * reader.zoom;
  for (let i=0; i<reader.book.pageCount; i++){
    const wrap = document.createElement("div");
    wrap.className = "page-wrap";
    wrap.dataset.index = i;
    wrap.style.width = w + "px";
    wrap.style.height = Math.round(w * reader.baseAspect) + "px";
    wrap.innerHTML = `<span class="ph">···</span><span class="page-num-badge mono">${i+1}</span>`;
    pageList.appendChild(wrap);
    reader.wraps.push(wrap);
  }
}
function setupObserver(){
  if (reader.observer) reader.observer.disconnect();
  reader.observer = new IntersectionObserver((entries) => {
    for (const entry of entries){ if (entry.isIntersecting) renderPage(Number(entry.target.dataset.index)); }
  }, { root: readerScroll, rootMargin: RENDER_MARGIN });
  reader.wraps.forEach(w => reader.observer.observe(w));
}
async function renderPage(idx){
  if (!reader || reader.rendered.has(idx) || reader.rendering.has(idx)) return;
  reader.rendering.add(idx);
  try{
    const page = await reader.doc.getPage(idx + 1);
    const w = containerWidth() * reader.zoom;
    const rawVp = page.getViewport({ scale: 1 });
    const scale = (w / rawVp.width) * (window.devicePixelRatio || 1);
    const viewport = page.getViewport({ scale });
    const wrap = reader.wraps[idx];
    if (!wrap) return;
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width; canvas.height = viewport.height;
    canvas.style.width = w + "px";
    canvas.style.height = Math.round(w * (viewport.height/viewport.width)) + "px";
    const ctx = canvas.getContext("2d");
    const task = page.render({ canvasContext: ctx, viewport });
    reader.rendered.set(idx, { canvas, task });
    await task.promise;
    wrap.style.height = canvas.style.height;
    const ph = wrap.querySelector(".ph"); if (ph) ph.remove();
    wrap.prepend(canvas);
    pruneRendered(idx);
  } catch(err){
    if (err && err.name !== "RenderingCancelledException") console.warn("Page render failed", idx, err);
  } finally { reader.rendering.delete(idx); }
}
function unrenderPage(idx){
  const rec = reader.rendered.get(idx);
  if (!rec) return;
  try { rec.task && rec.task.cancel && rec.task.cancel(); } catch(e){}
  const wrap = reader.wraps[idx];
  if (wrap && rec.canvas.parentElement === wrap){
    wrap.removeChild(rec.canvas);
    const ph = document.createElement("span"); ph.className = "ph"; ph.textContent = "···";
    wrap.prepend(ph);
  }
  reader.rendered.delete(idx);
}
function pruneRendered(centerIdx){
  if (reader.rendered.size <= MAX_RENDERED) return;
  const indices = [...reader.rendered.keys()].sort((a,b) => Math.abs(b-centerIdx) - Math.abs(a-centerIdx));
  while (reader.rendered.size > MAX_RENDERED) unrenderPage(indices.shift());
}
function kickNearbyRender(idx){
  for (let i = Math.max(0, idx-2); i <= Math.min(reader.wraps.length-1, idx+4); i++) renderPage(i);
}

/* ---------------------------- Reflow text mode --------------------------- */
async function checkReflowAvailable(doc){
  try{
    const l1 = await extractPageLines(doc, 0);
    if (l1.length >= 2) return true;
    if (doc.numPages > 1){ const l2 = await extractPageLines(doc, 1); if (l2.length >= 2) return true; }
    return false;
  } catch(e){ return false; }
}
async function extractPageLines(doc, pageIndex){
  const page = await doc.getPage(pageIndex + 1);
  const tc = await page.getTextContent();
  const items = tc.items.filter(it => it.str && it.str.trim().length);
  const lines = [];
  let cur = null;
  for (const it of items){
    const x = it.transform[4], y = it.transform[5];
    const fontSize = Math.hypot(it.transform[2], it.transform[3]) || 10;
    if (!cur || Math.abs(y - cur.y) > fontSize * 0.55){
      cur = { y, x0:x, fontSize, text: it.str, lastX: x + (it.width || 0) };
      lines.push(cur);
    } else {
      const gap = x - cur.lastX;
      cur.text += (gap > fontSize * 0.18 ? " " : "") + it.str;
      cur.lastX = x + (it.width || 0);
      cur.fontSize = Math.max(cur.fontSize, fontSize);
    }
  }
  if (page.cleanup) page.cleanup();
  return lines;
}
function linesToParagraphs(lines, pageIndex){
  if (!lines.length) return [];
  const sizes = lines.map(l => l.fontSize).sort((a,b) => a-b);
  const medianSize = sizes[Math.floor(sizes.length/2)] || 10;
  const gaps = [];
  for (let i=1;i<lines.length;i++) gaps.push(lines[i-1].y - lines[i].y);
  gaps.sort((a,b) => a-b);
  const medianGap = gaps.length ? gaps[Math.floor(gaps.length/2)] : medianSize * 1.2;
  const baseX = Math.min(...lines.map(l => l.x0));

  const paras = [];
  let buf = null, bufHeading = false;
  lines.forEach((line, i) => {
    const isHeading = line.fontSize > medianSize * 1.25;
    const prevGap = i > 0 ? (lines[i-1].y - line.y) : medianGap;
    const indented = (line.x0 - baseX) > line.fontSize * 1.5;
    const newPara = !buf || isHeading || bufHeading || prevGap > medianGap * 1.6 || (indented && prevGap > medianGap * 1.05);
    const text = line.text.trim();
    if (!text) return;
    if (newPara){
      if (buf) paras.push(buf);
      buf = { text, page: pageIndex, heading: isHeading };
      bufHeading = isHeading;
    } else {
      if (/[a-z\-]-$/.test(buf.text) && /^[a-z]/.test(text)) buf.text = buf.text.replace(/-$/, "") + text;
      else buf.text += " " + text;
    }
  });
  if (buf) paras.push(buf);
  return paras;
}
async function buildReflowParagraphs(doc, pageCount, onProgress){
  const all = [];
  for (let p=0; p<pageCount; p++){
    const lines = await extractPageLines(doc, p);
    const paras = linesToParagraphs(lines, p);
    if (paras.length && all.length){
      const prev = all[all.length-1], first = paras[0];
      if (!prev.heading && !first.heading && !/[.?!"”’)]\s*$/.test(prev.text) && /^[a-z0-9]/.test(first.text)){
        prev.text += " " + first.text;
        paras.shift();
      }
    }
    all.push(...paras);
    if (onProgress) onProgress(p+1, pageCount);
    if ((p & 7) === 0) await new Promise(r => setTimeout(r));
  }
  return all;
}
function renderReflowParagraphs(paras){
  reflowList.innerHTML = "";
  if (!paras.length){
    reflowList.innerHTML = `<div class="reflow-note">No selectable text was found in this PDF — it's likely a scan of images.<br>Reflow view isn't available for this book; use Original instead.</div>`;
    reader.reflowBlocks = [];
    return;
  }
  const frag = document.createDocumentFragment();
  reader.reflowBlocks = [];
  paras.forEach(p => {
    const el = document.createElement("p");
    el.className = "reflow-p" + (p.heading ? " heading" : "");
    el.dataset.page = p.page;
    el.textContent = p.text;
    frag.appendChild(el);
    reader.reflowBlocks.push(el);
  });
  reflowList.appendChild(frag);
}
function updateModeAvailability(){
  const btn = document.querySelector('#mode-segmented button[data-mode="reflow"]');
  if (btn) btn.disabled = !reader.reflowAvailable;
}

/* ------------------------- Generic position tracking ---------------------- */
function activeBlocks(){ return reader.mode === "original" ? reader.wraps : reader.reflowBlocks; }
function pageForBlockIndex(idx){
  if (reader.mode === "original") return idx;
  const el = reader.reflowBlocks[idx];
  return el ? Number(el.dataset.page) : 0;
}
function updateCurrentIndex(){
  const blocks = activeBlocks();
  if (!blocks.length) return;
  const refY = readerScroll.scrollTop + 90;
  let idx = reader.currentIndex;
  for (let i=0;i<blocks.length;i++){
    const el = blocks[i];
    if (el.offsetTop <= refY && el.offsetTop + el.offsetHeight > refY){ idx = i; break; }
  }
  reader.currentIndex = idx;
  updateProgressLabel();
}
function updateProgressLabel(){
  const page = pageForBlockIndex(reader.currentIndex);
  readerProgress.textContent = `Page ${page + 1} of ${reader.book.pageCount}`;
}
function currentPositionRatio(){
  const blocks = activeBlocks();
  const el = blocks[reader.currentIndex];
  if (!el) return 0;
  const refY = readerScroll.scrollTop + 90;
  return Math.min(1, Math.max(0, (refY - el.offsetTop) / el.offsetHeight));
}
function saveCurrentPosition(){
  if (!reader) return;
  const pos = { page: reader.currentIndex, ratio: currentPositionRatio() };
  if (reader.mode === "original") reader.book.position = pos;
  else reader.book.reflowPosition = pos;
  Store.putBook(reader.book);
}
const schedulePositionSave = debounce(saveCurrentPosition, 450);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveCurrentPosition(); });
window.addEventListener("pagehide", saveCurrentPosition);

function restoreScrollPositionForMode(){
  const pos = reader.mode === "original" ? reader.book.position : reader.book.reflowPosition;
  const blocks = activeBlocks();
  const el = blocks[pos.page || 0];
  if (!el) { readerScroll.scrollTop = 0; return; }
  readerScroll.scrollTop = Math.max(0, el.offsetTop + (pos.ratio || 0) * el.offsetHeight - 90);
  reader.currentIndex = pos.page || 0;
  if (reader.mode === "original") kickNearbyRender(reader.currentIndex);
}

/* ---- scroll: chrome auto-hide, position tracking, scrubber fill ---- */
let lastTopbarShow = true, lastScrollTop = 0;
readerScroll.addEventListener("scroll", () => {
  if (!reader) return;
  const st = readerScroll.scrollTop;
  if (Math.abs(st - lastScrollTop) > 6){
    const goingDown = st > lastScrollTop;
    if (goingDown && lastTopbarShow && st > 80) setChromeVisible(false);
    else if (!goingDown && !lastTopbarShow) setChromeVisible(true);
    lastScrollTop = st;
  }
  updateCurrentIndex();
  updateScrubberFill();
  schedulePositionSave();
}, { passive:true });

function setChromeVisible(show){
  readerTopbar.classList.toggle("hidden", !show);
  scrubber.classList.toggle("hidden", !show);
  lastTopbarShow = show;
}
// Tap the page area to toggle chrome (ignore taps on chrome/sheets themselves).
readerScroll.addEventListener("click", (e) => {
  if (e.target.closest(".reader-topbar, .scrubber")) return;
  setChromeVisible(!lastTopbarShow);
});

function updateScrubberFill(){
  const max = readerScroll.scrollHeight - readerScroll.clientHeight;
  const frac = max > 0 ? Math.min(1, Math.max(0, readerScroll.scrollTop / max)) : 0;
  scrubberFill.style.width = (frac*100) + "%";
  scrubberKnob.style.left = (frac*100) + "%";
}

/* ---- Back / close reader ---- */
document.getElementById("reader-back").addEventListener("click", closeReader);
function closeReader(){
  saveCurrentPosition();
  if (reader){
    reader.observer && reader.observer.disconnect();
    reader.rendered.forEach((_, idx) => unrenderPage(idx));
    reader.doc && reader.doc.destroy();
  }
  reader = null;
  showView("library");
  refreshLibrary();
}

/* ---- Mode switching (Original <-> Reflow) ---- */
async function switchReaderMode(newMode, isInitial){
  if (!reader || (reader.mode === newMode && !isInitial)) return;
  if (newMode === "reflow" && !reader.reflowAvailable) return;
  if (!isInitial) saveCurrentPosition();

  reader.mode = newMode;
  reader.book.readMode = newMode;
  Store.putBook(reader.book);

  if (newMode === "reflow" && !reader.reflowBuilt){
    readerLoading.classList.remove("hidden");
    setLoadingText("Preparing reflow view…");
    const paras = await buildReflowParagraphs(reader.doc, reader.book.pageCount,
      (done, total) => setLoadingText(`Preparing reflow view… ${done}/${total}`));
    renderReflowParagraphs(paras);
    reader.reflowBuilt = true;
    readerLoading.classList.add("hidden");
  }

  pageList.classList.toggle("hidden", newMode !== "original");
  reflowList.classList.toggle("hidden", newMode !== "reflow");
  restoreScrollPositionForMode();
  updateProgressLabel();
  updateScrubberFill();
}

/* ---- Zoom (Original mode) ---- */
function applyZoom(newZoom){
  if (!reader) return;
  newZoom = Math.min(3, Math.max(0.6, newZoom));
  if (Math.abs(newZoom - reader.zoom) < 0.01) return;
  const savedIdx = reader.currentIndex, savedRatio = currentPositionRatio();
  reader.zoom = newZoom;
  prefs.zoom = newZoom; savePrefs(); applyZoomLabel();
  reader.rendered.forEach((_, idx) => unrenderPage(idx));
  buildPlaceholders(); setupObserver();
  const wrap = reader.wraps[savedIdx];
  if (wrap) readerScroll.scrollTop = Math.max(0, wrap.offsetTop + savedRatio * wrap.offsetHeight - 90);
  kickNearbyRender(savedIdx);
}
document.getElementById("zoom-inc").addEventListener("click", () => applyZoom(reader.zoom + 0.15));
document.getElementById("zoom-dec").addEventListener("click", () => applyZoom(reader.zoom - 0.15));

// Pinch-to-zoom (Original mode): live CSS preview while pinching, committed on release.
let pinch = null;
readerScroll.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2 && reader && reader.mode === "original"){
    const [a,b] = e.touches;
    pinch = {
      startDist: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY),
      startZoom: reader.zoom,
      originX: (a.clientX + b.clientX)/2 - pageList.getBoundingClientRect().left,
      originY: (a.clientY + b.clientY)/2 - pageList.getBoundingClientRect().top + readerScroll.scrollTop
    };
    pageList.style.transformOrigin = `${pinch.originX}px ${pinch.originY}px`;
  }
}, { passive:true });
readerScroll.addEventListener("touchmove", (e) => {
  if (pinch && e.touches.length === 2){
    const [a,b] = e.touches;
    const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    pageList.style.transform = `scale(${dist / pinch.startDist})`;
  }
}, { passive:true });
readerScroll.addEventListener("touchend", (e) => {
  if (pinch && e.touches.length < 2){
    const m = /scale\(([\d.]+)\)/.exec(pageList.style.transform);
    const ratio = m ? parseFloat(m[1]) : 1;
    pageList.style.transform = "none";
    applyZoom(pinch.startZoom * ratio);
    pinch = null;
  }
});
window.addEventListener("resize", debounce(() => { if (reader && reader.mode === "original") applyZoom(reader.zoom); }, 200));

/* ---- Scrubber drag-to-jump ---- */
let scrubbing = false;
function updateScrubFromClientX(clientX, isDragging){
  const rect = scrubberTrack.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  const max = readerScroll.scrollHeight - readerScroll.clientHeight;
  readerScroll.scrollTop = frac * max;
  scrubberFill.style.width = (frac*100) + "%";
  scrubberKnob.style.left = (frac*100) + "%";
  if (isDragging && reader){
    const approxPage = Math.round(frac * (reader.book.pageCount - 1)) + 1;
    scrubTooltip.textContent = `Page ${approxPage}`;
    scrubTooltip.style.left = (rect.left + frac*rect.width) + "px";
    scrubTooltip.classList.add("show");
  }
  updateCurrentIndex();
}
scrubberTrack.addEventListener("pointerdown", (e) => {
  scrubbing = true;
  scrubberTrack.setPointerCapture(e.pointerId);
  updateScrubFromClientX(e.clientX, true);
});
scrubberTrack.addEventListener("pointermove", (e) => { if (scrubbing) updateScrubFromClientX(e.clientX, true); });
window.addEventListener("pointerup", (e) => {
  if (scrubbing){ scrubbing = false; updateScrubFromClientX(e.clientX, false); scrubTooltip.classList.remove("show"); saveCurrentPosition(); }
});

/* =========================================================================
   SETTINGS SHEET
   ========================================================================= */
const settingsBackdrop = document.getElementById("settings-backdrop");
const settingsSheet = document.getElementById("settings-sheet");
document.getElementById("settings-btn").addEventListener("click", () => {
  settingsSheet.dataset.mode = reader ? reader.mode : "original";
  document.querySelectorAll("#mode-segmented button").forEach(b => b.classList.toggle("active", reader && b.dataset.mode === reader.mode));
  settingsBackdrop.classList.add("show");
});
document.getElementById("settings-done").addEventListener("click", () => settingsBackdrop.classList.remove("show"));
settingsBackdrop.addEventListener("click", (e) => { if (e.target === settingsBackdrop) settingsBackdrop.classList.remove("show"); });

document.querySelectorAll("#mode-segmented button").forEach(btn => {
  btn.addEventListener("click", async () => {
    if (btn.disabled || !reader) return;
    document.querySelectorAll("#mode-segmented button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    settingsSheet.dataset.mode = btn.dataset.mode;
    await switchReaderMode(btn.dataset.mode, false);
  });
});
document.querySelectorAll("#font-segmented button").forEach(btn => {
  btn.addEventListener("click", () => { prefs.fontFamily = btn.dataset.font; savePrefs(); applyReflowStyle(); });
});
document.querySelectorAll("#spacing-segmented button").forEach(btn => {
  btn.addEventListener("click", () => { prefs.lineSpacing = btn.dataset.spacing; savePrefs(); applyReflowStyle(); });
});
document.querySelectorAll("#margin-segmented button").forEach(btn => {
  btn.addEventListener("click", () => { prefs.margin = btn.dataset.margin; savePrefs(); applyReflowStyle(); });
});
document.querySelectorAll("#theme-swatches .swatch").forEach(btn => {
  btn.addEventListener("click", () => { prefs.theme = btn.dataset.theme; savePrefs(); applyTheme(); });
});
document.getElementById("font-inc").addEventListener("click", () => { prefs.fontSize = Math.min(30, prefs.fontSize + 1); savePrefs(); applyReflowStyle(); });
document.getElementById("font-dec").addEventListener("click", () => { prefs.fontSize = Math.max(13, prefs.fontSize - 1); savePrefs(); applyReflowStyle(); });
document.getElementById("invert-toggle").addEventListener("change", (e) => { prefs.invert = e.target.checked; savePrefs(); applyInvert(); });

/* =========================================================================
   Boot
   ========================================================================= */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
refreshLibrary();
</script>
